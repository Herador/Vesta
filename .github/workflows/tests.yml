name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pyflakes
        run: python -m pyflakes app outils tests

      - name: pytest
        run: python -m pytest
